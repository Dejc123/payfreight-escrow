<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayFreight Protocol Widget</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%230b1329'/><path d='M7 12l3 3 7-7' stroke='%2338bdf8' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
    <style>
        :root {
            --bg: #0b1329;
            --card-bg: #131b36;
            --accent: #38bdf8;
            --accent-hover: #7dd3fc;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(56, 189, 248, 0.2);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        .card h2 {
            color: var(--text);
            margin-top: 0;
        }
        .payfreight-btn {
            background-color: var(--accent);
            color: #0b1329;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 15px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.3);
        }
        .payfreight-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 25px rgba(56, 189, 248, 0.5);
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: var(--accent);
        }
        #result {
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Logistics Load #123456</h2>
        <p style="color: var(--text-muted); font-size: 14px;">PayFreight B2B Solana Escrow & e-CMR Compliance</p>
        
        <!-- PayFreight protocol action button with generic identifiers -->
        <button class="payfreight-btn" onclick="startPayFreight('REF-123456', 'USER-PARTNER-789')">
            PayFreight Escrow 🔒
        </button>

        <p id="result"></p>

        <br>
        <a href="index.html" class="back-link">← Back to Landing Page</a>
    </div>

    <script>
        async function startPayFreight(externalId, participantId) {
            try {
                const response = await fetch('http://localhost:3000/api/payfreight/confirm', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        externalId: externalId,
                        participantId: participantId
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('result').innerText = `Success! Protocol Transaction ID: ${data.transaction.id}`;
                } else {
                    document.getElementById('result').innerText = `Error: ${data.message}`;
                }
            } catch (error) {
                console.error('Connection error:', error);
                document.getElementById('result').innerText = 'Error connecting to PayFreight Protocol server.';
            }
        }
    </script>

</body>
</html>

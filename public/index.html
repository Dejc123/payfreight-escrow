<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayFreight – Automated Solana Settlement Protocol & e-CMR Compliance</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%230b1329'/><path d='M7 12l3 3 7-7' stroke='%2338bdf8' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: #131b36;
            --accent: #38bdf8;
            --accent-hover: #7dd3fc;
            --indigo: #6366f1;
            --indigo-hover: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(56, 189, 248, 0.2);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            width: 90%;
            margin: 40px auto;
            padding: 50px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        /* ORIGINAL LOGO STYLES */
        .logo-wrapper {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-icon {
            width: 140px;
            height: 140px;
            filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.35));
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .logo-wrapper:hover .logo-icon {
            transform: scale(1.05);
            filter: drop-shadow(0 0 35px rgba(56, 189, 248, 0.55));
        }

        h1 {
            font-size: 2.8rem;
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        h1 span {
            color: var(--accent);
        }

        p.subtitle {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.5;
        }
        
        /* DUAL CTA BUTTONS */
        .cta-main-container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            justify-content: center;
            align-items: stretch;
            margin: 35px 0;
            flex-wrap: wrap;
        }

        .cta-card {
            flex: 1;
            min-width: 260px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            padding: 22px 28px;
            border-radius: 10px;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
        }
        
        /* LEVI GUMB: INDIGO / VIJOLIČNA (Za špediterje in naročnike prevoza) */
        .cta-pay-freight {
            background-color: var(--indigo);
            color: #ffffff;
            box-shadow: 0 4px 25px rgba(99, 102, 241, 0.4);
            border: 1px solid var(--indigo-hover);
        }

        .cta-pay-freight:hover {
            background-color: var(--indigo-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(99, 102, 241, 0.6);
        }

        /* DESNI GUMB: SVETLO MODRA (Za prevoznike) */
        .cta-carrier-payout {
            background-color: var(--accent);
            color: #0b1329;
            box-shadow: 0 4px 25px rgba(56, 189, 248, 0.3);
            border: 1px solid var(--accent-hover);
        }

        .cta-carrier-payout:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(56, 189, 248, 0.5);
        }

        .cta-title {
            font-size: 1.15rem;
            font-weight: 700;
            display: block;
            margin-bottom: 6px;
        }

        .cta-subtext {
            font-size: 0.85rem;
            font-weight: 600;
            opacity: 0.9;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .intro-text {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.7;
            margin: 30px 0;
            text-align: left;
            background: rgba(255,255,255,0.015);
            padding: 25px;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
            border-top: 1px solid rgba(255,255,255,0.03);
            border-right: 1px solid rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            text-align: left;
        }

        .feature-box {
            background: rgba(255,255,255,0.02);
            padding: 22px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .feature-box h3 {
            color: var(--accent);
            margin-top: 0;
            font-size: 1.1rem;
        }

        .feature-box p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 0;
            line-height: 1.5;
        }

        .secondary-links {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .cta-button-secondary {
            display: inline-block;
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .cta-button-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(56, 189, 248, 0.05);
        }

        footer {
            margin-top: 35px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.04);
            padding-top: 20px;
        }
    </style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayFreight Protocol – Settlement & e-CMR Escrow Engine</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%230b1329'/><path d='M7 12l3 3 7-7' stroke='%2338bdf8' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: #131b36;
            --accent: #38bdf8;
            --accent-hover: #7dd3fc;
            --indigo: #6366f1;
            --indigo-hover: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(56, 189, 248, 0.18);
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 820px;
            width: 92%;
            margin: 20px auto;
            padding: 35px 40px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
            position: relative;
        }

        /* TOP NAVIGATION / PROTOCOL HEADER BAR */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
            gap: 12px;
        }

        .status-bar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            color: var(--success);
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-nav-fiat {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            padding: 7px 14px;
            font-size: 0.82rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-nav-fiat:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-nav-wallet {
            background: linear-gradient(135deg, var(--indigo) 0%, #4f46e5 100%);
            border: 1px solid var(--indigo-hover);
            color: #ffffff;
            padding: 7px 15px;
            font-size: 0.82rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 10px rgba(99, 102, 241, 0.3);
            transition: all 0.2s ease;
        }

        .btn-nav-wallet:hover {
            background: linear-gradient(135deg, var(--indigo-hover) 0%, var(--indigo) 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.5);
        }

        /* BRAND HEADER */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 6px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.35));
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .brand-header:hover .logo-icon {
            transform: scale(1.05) rotate(-2deg);
            filter: drop-shadow(0 0 18px rgba(56, 189, 248, 0.6));
        }

        h1 {
            font-size: 2.4rem;
            margin: 0;
            color: var(--text-main);
            letter-spacing: -0.5px;
            line-height: 1;
            font-weight: 800;
        }

        h1 span {
            color: var(--accent);
        }

        p.subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: 10px;
            margin-bottom: 25px;
            line-height: 1.4;
            font-weight: 400;
        }
        
        /* DUAL ENTRY ACTIONS */
        .cta-main-container {
            display: flex;
            flex-direction: row;
            gap: 16px;
            justify-content: center;
            align-items: stretch;
            margin: 20px 0 25px 0;
            flex-wrap: wrap;
        }

        .cta-card {
            flex: 1;
            min-width: 240px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            padding: 18px 22px;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            transition: transform 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease;
        }

        /* Svetlikajoč se preliv na gumbih */
        .cta-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 50%;
            height: 200%;
            background: linear-gradient(
                60deg, 
                transparent 30%, 
                rgba(255, 255, 255, 0.25) 50%, 
                transparent 70%
            );
            transform: rotate(25deg);
            transition: all 0.6s ease;
            opacity: 0;
        }

        .cta-card:hover::after {
            left: 130%;
            opacity: 1;
        }
        
        .cta-pay-freight {
            background-color: var(--indigo);
            color: #ffffff;
            box-shadow: 0 4px 18px rgba(99, 102, 241, 0.35);
            border: 1px solid var(--indigo-hover);
        }

        .cta-pay-freight:hover {
            background-color: var(--indigo-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(99, 102, 241, 0.6);
        }

        .cta-carrier-payout {
            background-color: var(--accent);
            color: #0b1329;
            box-shadow: 0 4px 18px rgba(56, 189, 248, 0.28);
            border: 1px solid var(--accent-hover);
        }

        .cta-carrier-payout:hover {
            background-color: var(--accent-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(56, 189, 248, 0.5);
        }

        .cta-title {
            font-size: 1.05rem;
            font-weight: 700;
            display: block;
            margin-bottom: 4px;
            position: relative;
            z-index: 2;
        }

        .cta-subtext {
            font-size: 0.75rem;
            font-weight: 700;
            opacity: 0.88;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 2;
        }

        /* SVETLIKAINI INTERAKTIVNI LOGOTIPI (PAYMENT GATEWAYS) */
        .payment-methods {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 20px 0 25px 0;
        }

        .pay-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .logos-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            flex-wrap: wrap;
        }

        .logos-container:hover {
            border-color: rgba(56, 189, 248, 0.35);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15), inset 0 0 10px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }

        .pay-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #e2e8f0;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .pay-badge:hover {
            transform: translateY(-2px) scale(1.05);
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--accent);
            color: #ffffff;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .pay-icon {
            width: 16px;
            height: 16px;
            display: inline-block;
            vertical-align: middle;
        }

        /* PROTOCOL LINKS */
        .secondary-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .cta-button-secondary {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .cta-button-secondary:hover {
            border-color: var(--accent);
            color: var(--text-main);
            background: rgba(56, 189, 248, 0.08);
        }

        footer {
            margin-top: 20px;
            font-size: 0.78rem;
            color: rgba(148, 163, 184, 0.6);
        }
    </style>
</head>

        :root {
            --bg-color: #0b1329;
            --card-bg: #131b36;
            --accent: #38bdf8;
            --accent-hover: #7dd3fc;
            --amber: #f59e0b;
            --amber-hover: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(56, 189, 248, 0.2);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 20px;
            padding: 50px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }
        h1 span {
            color: var(--accent);
        }
        p.subtitle {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.5;
        }
        
        /* DUAL CTA BUTTONS */
        .cta-main-container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            justify-content: center;
            align-items: stretch;
            margin: 35px 0;
            flex-wrap: wrap;
        }
        .cta-card {
            flex: 1;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-decoration: none;
            padding: 22px 28px;
            border-radius: 10px;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
        }
        
        /* LEVI GUMB: ZLATO / AMBER (Za tiste, ki prodajo furo) */
        .cta-pay-freight {
            background-color: var(--amber);
            color: #0f172a;
            box-shadow: 0 4px 25px rgba(245, 158, 11, 0.35);
            border: 1px solid var(--amber-hover);
        }
        .cta-pay-freight:hover {
            background-color: var(--amber-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(245, 158, 11, 0.55);
        }

        /* DESNI GUMB: SVETLO MODRA (Za prevoznike) */
        .cta-carrier-payout {
            background-color: var(--accent);
            color: #0b1329;
            box-shadow: 0 4px 25px rgba(56, 189, 248, 0.3);
            border: 1px solid var(--accent-hover);
        }
        .cta-carrier-payout:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(56, 189, 248, 0.5);
        }

        .cta-title {
            font-size: 1.15rem;
            font-weight: 700;
            display: block;
            margin-bottom: 6px;
        }
        .cta-subtext {
            font-size: 0.85rem;
            font-weight: 600;
            opacity: 0.85;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .intro-text {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.7;
            margin: 30px 0;
            text-align: left;
            background: rgba(255,255,255,0.015);
            padding: 25px;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
            border-top: 1px solid rgba(255,255,255,0.03);
            border-right: 1px solid rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .features {
            display: grid;

            gap: 20px;
            margin-bottom: 30px;
            text-align: left;
        }
        .feature-box {

            padding: 22px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .feature-box h3 {
            color: var(--accent);
            margin-top: 0;
            font-size: 1.1rem;
        }
        .feature-box p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 0;
            line-height: 1.5;
        }
        .secondary-links {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
